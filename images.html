<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images in HTML</title>
</head>
<body>

    <h1>Images in HTML</h1>

    <p>
        This page demonstrates how images are added and displayed in HTML
        using different image sources.
    </p>

    <!-- Image using relative path -->
    <h3>Image from Local Folder</h3>
    <img
        src="images/profile.jpg"
        alt="Profile image"
        width="300"
    />

    <br><br>

    <!-- Image using external source -->
    <h3>Image from External Source</h3>
    <img
        src="https://via.placeholder.com/300"
        alt="External sample image"
        width="300"
    />

</body>
</html>
